plugins {
	// FIX: Replaced the dynamic snapshot variable string with a direct static string format 
	// to allow Gradle 9.5.1 to register Loom configurations correctly
	id 'net.fabricmc.fabric-loom' version '1.17.13'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
}

loom {
	mods {
		"crystalspeed" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	
	// This configuration method is now fully recognized by Loom 1.17.13
	mappings "net.fabricmc:yarn:${project.minecraft_version}+build.1:v2"

	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}
